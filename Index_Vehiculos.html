<DOCTYPE>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario Registro</h1>
    <form action="control.html" method="get">
        <label for="propietario">Propietario</label>
        <input type="text" name="propietario" placeholder="Ingrese el propietario del vehiculo" required>
        <br>
        <label for="placa">Placa</label>
        <input type ="text" name="placa" placeholder="Ingresa la placa del vehiculo" required>
        <br>
        <label for ="marca">Marca</label>
        <select name="marca" required>
            <option value="marca" disabled selected>Seleccione una marca</option>
            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
            <option value="Chevrolet">Chevrolet</option>
            <option value="Ford">Ford</option>
        </select>
        <br>
        <label for="modelo">Modelo:</label>
        <input type ="text" name="modelo" required>
        <br><br>
        <label for="tipo-servicio">Tipo de servicio:</label>
        <br>
        <label for="aceite">Aceite</label>
        <input type="checkbox" name="tipo-servicio" value ="aceite">
        <br>
        <label for="balanceo">Balanceo</label>
        <input type="checkbox" name="tipo-servicio" value="balanceo">
        <br>
        <label for="alineo">Alineo</label>
        <input type="checkbox" name="tipo-servicio" value="alineo">
        <br>
        <label for="lavado">Lavado</label>
        <input type="checkbox" name="tipo-servicio" value ="lavado">
        <br><br>
        <label for="servicio">Servicio:</label>
        <br>
        <label for="publico">Público</label>
        <input type="radio" name="servicio" value="publico" required>
        <label for="privado">Privado</label>
        <input type="radio" name="servicio" value="privado" required>
        <br>
        <input type ="reset" value="Borrar datos">
        <input type="submit" value="Enviar datos">
    </form>
</body>
</DOCTYPE>
